name: Bug report
description: Report a problem with publishing or verification
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste cookies, SESSDATA, bili_jct, or full API responses
        containing account identifiers.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the failing step and the error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.3 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true
